<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c0d0f" />
    <meta name="description" content="Orbit private routing workspace" />
    <title>Orbit</title>
    <link rel="stylesheet" href="/style.css" />
    <script defer src="/baremux/index.js"></script>
    <script defer src="/uv/uv.bundle.js"></script>
    <script defer src="/uv/uv.config.js"></script>
    <script defer src="/register-sw.js"></script>
    <script defer src="/app.js"></script>
  </head>
  <body>
    <main class="route-panel">
      <div class="brand" aria-label="Orbit"><span class="brand-mark" aria-hidden="true"></span><span>orbit</span></div>
      <p class="eyebrow">PRIVATE ROUTE</p>
      <h1>Go anywhere.</h1>
      <form id="route-form" novalidate>
        <label class="sr-only" for="route-input">Address or search query</label>
        <input id="route-input" autocomplete="off" autofocus placeholder="Enter a URL or search" spellcheck="false" />
        <button type="submit">Route</button>
      </form>
      <p class="status" id="route-status" role="status" aria-live="polite">Ready</p>
      <p class="notice">Orbit runs on Vercel. Its Wisp transport is configured separately.</p>
    </main>
  </body>
</html>
